name: dependency-audit

# 매일 루트 런타임·개발 의존성의 high 이상 취약점을 검사한다.
# test/fixtures/omp-host는 업스트림 테스트 픽스처 전용이므로 제외한다.
on:
  schedule:
    - cron: "23 22 * * *" # 07:23 KST
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: dependency-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    if: github.event_name != 'schedule' || github.repository == 'gimso2x/jabbu-pocket'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun audit --audit-level=high
