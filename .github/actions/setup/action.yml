name: setup
description: Bun을 설치하고 두 lockfile로 설치 캐시를 맞춘 뒤 frozen-lockfile로 의존성을 설치한다.
runs:
  using: composite
  steps:
    # package.json의 packageManager/engines.bun과 같은 버전. test/ci-workflow.test.ts가 이 값을 검사한다.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.4"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'test/fixtures/omp-host/bun.lock') }}
    - shell: bash
      run: bun install --frozen-lockfile
